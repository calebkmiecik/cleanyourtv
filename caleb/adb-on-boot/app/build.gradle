plugins {
    id 'com.android.application'
}

android {
    namespace 'com.caleb.adbonboot'
    compileSdk 34

    defaultConfig {
        applicationId 'com.caleb.adbonboot'
        minSdk 30 // wireless debugging exists from Android 11
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            // Sideloaded over ADB, never published.
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
